<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enable Marketing Features - DataFlow Hub AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .info p {
            margin: 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎯 Enable Marketing Features</h1>
        
        <div class="info">
            <p><strong>Current User:</strong> kkaufma72@gmail.com</p>
            <p style="margin-top: 8px; font-size: 14px;">This will enable AI marketing features including campaign generation, customer personas, and copywriting assistance.</p>
        </div>

        <form id="profileForm">
            <div class="form-group">
                <label for="useCase">Use Case *</label>
                <select id="useCase" required>
                    <option value="">Select a use case...</option>
                    <option value="marketing-analytics">Marketing Analytics 🎯 (Recommended)</option>
                    <option value="customer-insights">Customer Insights 👥</option>
                    <option value="sales-forecasting">Sales Forecasting 📈</option>
                    <option value="business-analytics">Business Analytics 💼</option>
                    <option value="real-estate">Real Estate 🏠</option>
                    <option value="retail">Retail 🛍️</option>
                </select>
            </div>

            <div class="form-group">
                <label for="jobTitle">Job Title (Optional)</label>
                <input type="text" id="jobTitle" placeholder="e.g., Marketing Manager">
            </div>

            <div class="form-group">
                <label for="company">Company (Optional)</label>
                <input type="text" id="company" placeholder="e.g., Acme Corp">
            </div>

            <button type="submit" id="submitBtn">
                🚀 Enable Marketing Features
            </button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Initialize Supabase - replace with your actual values
        const SUPABASE_URL = 'https://bcobpxgktvgfsffdsiog.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjb2JweGdrdHZnZnNmZmRzaW9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU1NDE0MjMsImV4cCI6MjA2MTExNzQyM30.YxVQN0m5lXKxEPU_fFgNowU0RZAUh2hwjmexXOLvzHc';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('profileForm');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const useCase = document.getElementById('useCase').value;
            const jobTitle = document.getElementById('jobTitle').value;
            const company = document.getElementById('company').value;

            if (!useCase) {
                showStatus('Please select a use case', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Updating...';

            try {
                // Get current user
                const { data: { user }, error: userError } = await supabase.auth.getUser();
                
                if (userError || !user) {
                    throw new Error('Not authenticated. Please log in to your app first.');
                }

                // Update user metadata
                const { error: updateError } = await supabase.auth.updateUser({
                    data: {
                        use_case: useCase,
                        ...(jobTitle && { job_title: jobTitle }),
                        ...(company && { company: company })
                    }
                });

                if (updateError) throw updateError;

                showStatus('✅ Marketing features enabled! Please refresh your DataFlow Hub AI app.', 'success');
                
                // Disable form
                form.querySelectorAll('input, select, button').forEach(el => el.disabled = true);
                
                setTimeout(() => {
                    window.close();
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                showStatus('❌ Error: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Enable Marketing Features';
            }
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
