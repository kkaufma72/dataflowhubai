services:
  # PostgreSQL Database - Primary data warehouse
  postgres:
    image: postgres:16-alpine
    container_name: dataflow_postgres
    environment:
      POSTGRES_USER: dataflow_user
      POSTGRES_PASSWORD: dataflow_secure_password
      POSTGRES_DB: dataflow_hub
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./local-db-init.sql:/docker-entrypoint-initdb.d/00-schema.sql
      - ./warehouse-init.sql:/docker-entrypoint-initdb.d/01-warehouse.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataflow_user -d dataflow_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped
    command: 
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"

  # PgBouncer - Connection pooling for Postgres
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: dataflow_pgbouncer
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=dataflow_user
      - DB_PASSWORD=dataflow_secure_password
      - DB_NAME=dataflow_hub
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=50
      - AUTH_TYPE=plain
    ports:
      - "6432:5432"
    depends_on:
      - postgres
    networks:
      - dataflow_network
    restart: unless-stopped

  # Redis - Caching and Real-time Data
  redis:
    image: redis:7-alpine
    container_name: dataflow_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped

  # Neo4j - Knowledge Graph and Entity Relationships
  neo4j:
    image: neo4j:5-community
    container_name: dataflow_neo4j
    environment:
      NEO4J_AUTH: neo4j/dataflow_secure_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 512M
    ports:
      - "7687:7687"  # Bolt protocol
      - "7474:7474"  # HTTP
      - "7473:7473"  # HTTPS
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
      - ./NEO4J_TEST_DATA.cypher:/var/lib/neo4j/import/test_data.cypher
    healthcheck:
      test: ["CMD", "cypher-shell", "-a", "neo4j://localhost:7687", "-u", "neo4j", "-p", "dataflow_secure_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped

  # MinIO - S3-compatible Object Storage for datasets
  minio:
    image: minio/minio:latest
    container_name: dataflow_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secure_password
    ports:
      - "9000:9000"
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped

  # TimescaleDB (PostgreSQL extension) - Time-series data
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: dataflow_timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: timescale_secure_password
      POSTGRES_DB: timescale
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/migrate-to-timescale.sql:/docker-entrypoint-initdb.d/01-timescale-setup.sql
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "timescaledb.telemetry_level=off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timescale"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped
  
  # PgBouncer for TimescaleDB - Connection pooling for metrics writes
  timescale_bouncer:
    image: edoburu/pgbouncer:latest
    container_name: dataflow_timescale_bouncer
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=timescale_secure_password
      - DB_NAME=timescale
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=300
      - DEFAULT_POOL_SIZE=40
      - AUTH_TYPE=plain
    ports:
      - "6433:5432"
    depends_on:
      - timescaledb
    networks:
      - dataflow_network
    restart: unless-stopped

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: dataflow_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - dataflow_network
    restart: unless-stopped

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: dataflow_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - dataflow_network
    restart: unless-stopped

  # FastAPI Backend - Main API server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataflow_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # App
      - DEBUG=true
      - ENVIRONMENT=development
      # Database
      - DATABASE_URL=postgresql://dataflow_user:dataflow_secure_password@pgbouncer:5432/dataflow_hub
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # TimescaleDB
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      - TIMESCALEDB_USER=postgres
      - TIMESCALEDB_PASSWORD=timescale_secure_password
      - TIMESCALEDB_DB=timescale
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin_secure_password
      # Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dataflow_secure_password
      # API Keys (add your own)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
      - VLLM_ENDPOINT=${VLLM_ENDPOINT:-http://localhost:8000/v1/chat/completions}
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      # Supabase Auth
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    depends_on:
      - postgres
      - redis
      - timescaledb
      - minio
      - neo4j
    networks:
      - dataflow_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://localhost:8000/api/health', timeout=5); sys.exit(0 if getattr(r, 'status', 200) == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker (CPU) - Async task processing
  celery_worker_cpu:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: dataflow_celery_worker_cpu
    command: celery -A celery_app worker --loglevel=info --concurrency=4 --queues=cpu_tasks
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://dataflow_user:dataflow_secure_password@pgbouncer:5432/dataflow_hub
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      - TIMESCALEDB_USER=postgres
      - TIMESCALEDB_PASSWORD=timescale_secure_password
      - TIMESCALEDB_DB=timescale
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
    depends_on:
      - redis
      - postgres
      - timescaledb
      - backend
    networks:
      - dataflow_network
    restart: unless-stopped

  # Celery Worker (GPU-heavy tasks)
  celery_worker_gpu:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: dataflow_celery_worker_gpu
    command: celery -A celery_app worker --loglevel=info --concurrency=2 --queues=gpu_tasks
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://dataflow_user:dataflow_secure_password@pgbouncer:5432/dataflow_hub
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      - TIMESCALEDB_USER=postgres
      - TIMESCALEDB_PASSWORD=timescale_secure_password
      - TIMESCALEDB_DB=timescale
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
    depends_on:
      - redis
      - postgres
      - timescaledb
      - backend
    networks:
      - dataflow_network
    restart: unless-stopped

  # Celery Worker (IO-bound tasks)
  celery_worker_io:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: dataflow_celery_worker_io
    command: celery -A celery_app worker --loglevel=info --concurrency=6 --queues=io_tasks
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://dataflow_user:dataflow_secure_password@pgbouncer:5432/dataflow_hub
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      - TIMESCALEDB_USER=postgres
      - TIMESCALEDB_PASSWORD=timescale_secure_password
      - TIMESCALEDB_DB=timescale
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
    depends_on:
      - redis
      - postgres
      - timescaledb
      - backend
    networks:
      - dataflow_network
    restart: unless-stopped

  # Celery Beat - Scheduled tasks
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: dataflow_celery_beat
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://dataflow_user:dataflow_secure_password@pgbouncer:5432/dataflow_hub
    depends_on:
      - redis
      - postgres
    networks:
      - dataflow_network
    restart: unless-stopped

  # Flower - Celery monitoring dashboard
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: dataflow_flower
    command: celery -A celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # Flower auth (optional)
      # - Set FLOWER_BASIC_AUTH="user:pass" to enable HTTP basic auth
      # - Or set FLOWER_UNAUTHENTICATED_API=true to enable the Flower API without auth (not recommended)
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:-admin:floweradmin}
      - FLOWER_UNAUTHENTICATED_API=${FLOWER_UNAUTHENTICATED_API:-}
      - FLOWER_INSPECT_TIMEOUT=${FLOWER_INSPECT_TIMEOUT:-5000}
    depends_on:
      - redis
      - celery_worker_cpu
      - celery_worker_gpu
      - celery_worker_io
    networks:
      - dataflow_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  timescaledb_data:
  prometheus_data:
  grafana_data:

networks:
  dataflow_network:
    driver: bridge
