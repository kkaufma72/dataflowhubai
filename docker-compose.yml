services:
  # PostgreSQL Database - Primary data warehouse
  postgres:
    image: postgres:16-alpine
    container_name: dataflow_postgres
    environment:
      POSTGRES_USER: dataflow_user
      POSTGRES_PASSWORD: dataflow_secure_password
      POSTGRES_DB: dataflow_hub
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./local-db-init.sql:/docker-entrypoint-initdb.d/00-schema.sql
      - ./warehouse-init.sql:/docker-entrypoint-initdb.d/01-warehouse.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataflow_user -d dataflow_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped
    command: 
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"

  # Redis - Caching and Real-time Data
  redis:
    image: redis:7-alpine
    container_name: dataflow_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped

  # Neo4j - Knowledge Graph and Entity Relationships
  neo4j:
    image: neo4j:5-community
    container_name: dataflow_neo4j
    environment:
      NEO4J_AUTH: neo4j/dataflow_secure_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 512M
    ports:
      - "7687:7687"  # Bolt protocol
      - "7474:7474"  # HTTP
      - "7473:7473"  # HTTPS
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
      - ./NEO4J_TEST_DATA.cypher:/var/lib/neo4j/import/test_data.cypher
    healthcheck:
      test: ["CMD", "cypher-shell", "-a", "neo4j://localhost:7687", "-u", "neo4j", "-p", "dataflow_secure_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped

  # MinIO - S3-compatible Object Storage for datasets
  minio:
    image: minio/minio:latest
    container_name: dataflow_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secure_password
    ports:
      - "9000:9000"
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped

  # TimescaleDB (PostgreSQL extension) - Time-series data
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: dataflow_timescaledb
    environment:
      POSTGRES_USER: tsdata_user
      POSTGRES_PASSWORD: timescale_secure_password
      POSTGRES_DB: timeseries_db
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsdata_user -d timeseries_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataflow_network
    restart: unless-stopped

  # Apache Kafka - Event streaming and data pipelines
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dataflow_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    networks:
      - dataflow_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Zookeeper - Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dataflow_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - dataflow_network
    healthcheck:
      test: echo ruok | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: dataflow_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - dataflow_network
    restart: unless-stopped

  # InfluxDB - Time-series metrics database
  influxdb:
    image: influxdb:2.7
    container_name: dataflow_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: dataflow_admin_2025
      DOCKER_INFLUXDB_INIT_ORG: dataflowhub
      DOCKER_INFLUXDB_INIT_BUCKET: model_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dataflow-influx-token-2025
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - dataflow_network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: dataflow_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - influxdb
    networks:
      - dataflow_network
    restart: unless-stopped

  # FastAPI Backend - Main API server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataflow_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # App
      - DEBUG=true
      - ENVIRONMENT=development
      # Database
      - DATABASE_URL=postgresql://dataflow_user:dataflow_secure_password@postgres:5432/dataflow_hub
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # TimescaleDB
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      - TIMESCALEDB_USER=tsdata_user
      - TIMESCALEDB_PASSWORD=timescale_secure_password
      - TIMESCALEDB_DB=timeseries_db
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin_secure_password
      # Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dataflow_secure_password
      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # API Keys (add your own)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
    depends_on:
      - postgres
      - redis
      - timescaledb
      - minio
      - neo4j
      - kafka
    networks:
      - dataflow_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://localhost:8000/api/health', timeout=5); sys.exit(0 if getattr(r, 'status', 200) == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker - Async task processing
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: dataflow_celery_worker
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://dataflow_user:dataflow_secure_password@postgres:5432/dataflow_hub
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      - TIMESCALEDB_USER=tsdata_user
      - TIMESCALEDB_PASSWORD=timescale_secure_password
      - TIMESCALEDB_DB=timeseries_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
    depends_on:
      - redis
      - postgres
      - timescaledb
      - backend
    networks:
      - dataflow_network
    restart: unless-stopped

  # Celery Beat - Scheduled tasks
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: dataflow_celery_beat
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://dataflow_user:dataflow_secure_password@postgres:5432/dataflow_hub
    depends_on:
      - redis
      - postgres
    networks:
      - dataflow_network
    restart: unless-stopped

  # Flower - Celery monitoring dashboard
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: dataflow_flower
    command: celery -A celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - celery_worker
    networks:
      - dataflow_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  timescaledb_data:
  prometheus_data:
  grafana_data:
  influxdb_data:
  influxdb_config:

networks:
  dataflow_network:
    driver: bridge
