apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: postgres
    secureJsonData:
      password: timescale_secure_password
    jsonData:
      database: timescale
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
